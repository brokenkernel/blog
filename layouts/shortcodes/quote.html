{{ with .Get "citeurl" }}
  <blockquote class="blockquote" cite="{{.}}">
{{ else }}
  <blockquote class="blockquote">
{{ end }}
{{.Inner }}
{{ if or (.Get "author") (.Get "citeurl") }}
  <footer class="blockquote-footer">
    {{ with .Get "author" }}
      &mdash; {{.}}
    {{ end }}
    <cite><a href="{{.Get "citeurl"}}">{{.Get "citetext"}}</a></cite>
  </footer>
{{ end }}
</blockquote>
